<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Website</title>

    <style>
        body {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            background-color: #64b1f9;
            color: #282828;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            color: #f10f0f;
        }

        .profile-img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #040404;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .bio-box {
            background-color: #f8873c;
            border: 2px solid #2e2f2f;
            border-radius: 8px;
            padding: 20px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 4px 6px rgb(255, 0, 0);
            margin-bottom: 30px;
            text-align: center;
        }

        .bio-box h2 {
            margin-top: 0;
            color: #2c3e50;
        }

        .video-container {
            margin-bottom: 30px;
            text-align: center;
        }

        .video-container iframe {
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>

</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
    </header>

    <img src="personalphoto.jpeg" class="profile-img">

    <div class="bio-box">
        <h2>me</h2>
        <p>
            hello, my name is gareth! i like alot of things except studying! <span>you can paynow me in the photo below. thanks.</span>
        </p>
    </div>

    <div class="video-container">
        <h2>favourite travel destination</h2>
        <iframe 
            width="560" 
            height="315" 
            src="https://www.youtube.com/embed/nZmO8B9rRik?autoplay=1&mute=1" 
            title="Favorite Travel Destination" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>

    <div>
        <img src="paylah.jpg" class="paynow-photo">
    </div>
</body>
</html>
